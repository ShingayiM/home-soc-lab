<svg viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b6472"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="490" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1f29">Home SOC Lab — Architecture</text>
  <text x="490" y="58" text-anchor="middle" font-size="13" fill="#5b6472">VirtualBox, host-only network 192.168.56.0/24</text>

  <!-- Host box -->
  <rect x="60" y="90" width="230" height="110" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="175" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">Host Machine</text>
  <text x="175" y="140" text-anchor="middle" font-size="12" fill="#434863">VirtualBox</text>
  <text x="175" y="158" text-anchor="middle" font-size="12" fill="#434863">Ollama (planned)</text>
  <text x="175" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#4338ca">192.168.56.1</text>

  <!-- NAT cloud (internet) -->
  <ellipse cx="175" cy="250" rx="80" ry="30" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="175" y="255" text-anchor="middle" font-size="12" fill="#6b7280">NAT / Internet</text>
  <text x="175" y="269" text-anchor="middle" font-size="10" fill="#9ca3af">(updates only)</text>
  <line x1="175" y1="200" x2="175" y2="222" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Host-only network bar -->
  <rect x="60" y="320" width="860" height="46" rx="8" fill="#0f172a"/>
  <text x="490" y="348" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Host-only network — 192.168.56.0/24  (isolated, DHCP off)</text>

  <!-- Connector: host to lab network -->
  <line x1="175" y1="200" x2="175" y2="320" stroke="#4338ca" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="188" y="290" font-size="11" fill="#4338ca">host-only vNIC</text>

  <!-- Wazuh VM -->
  <rect x="80" y="420" width="250" height="150" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="205" y="448" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">wazuhserver</text>
  <text x="205" y="468" text-anchor="middle" font-size="11" fill="#047857">Ubuntu Server 22.04</text>
  <text x="205" y="486" text-anchor="middle" font-size="11" fill="#065f46">Indexer · Manager · Dashboard</text>
  <text x="205" y="504" text-anchor="middle" font-size="11" fill="#065f46">8 GB RAM · 4 CPU · 60 GB</text>
  <rect x="150" y="516" width="110" height="26" rx="6" fill="#10b981"/>
  <text x="205" y="534" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">192.168.56.10</text>
  <text x="205" y="556" text-anchor="middle" font-size="10" fill="#059669">NAT: updates only</text>

  <!-- Windows Server VM -->
  <rect x="365" y="420" width="250" height="150" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="490" y="448" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">winserver01</text>
  <text x="490" y="468" text-anchor="middle" font-size="11" fill="#1d4ed8">Windows Server 2025 Eval</text>
  <text x="490" y="486" text-anchor="middle" font-size="11" fill="#1e3a8a">Wazuh agent + Sysmon</text>
  <text x="490" y="504" text-anchor="middle" font-size="11" fill="#1e3a8a">4 GB RAM · 2 CPU · 50 GB</text>
  <rect x="435" y="516" width="110" height="26" rx="6" fill="#3b82f6"/>
  <text x="490" y="534" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">192.168.56.20</text>
  <text x="490" y="556" text-anchor="middle" font-size="10" fill="#2563eb">NAT: updates only</text>

  <!-- Kali VM -->
  <rect x="650" y="420" width="250" height="150" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="775" y="448" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">kali</text>
  <text x="775" y="468" text-anchor="middle" font-size="11" fill="#b91c1c">Kali Linux (attacker)</text>
  <text x="775" y="486" text-anchor="middle" font-size="11" fill="#7f1d1d">nmap · hydra · netexec</text>
  <text x="775" y="504" text-anchor="middle" font-size="11" fill="#7f1d1d">2-4 GB RAM · 2 CPU</text>
  <rect x="720" y="516" width="110" height="26" rx="6" fill="#ef4444"/>
  <text x="775" y="534" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">192.168.56.30</text>
  <text x="775" y="556" text-anchor="middle" font-size="10" fill="#dc2626">host-only only (no NAT)</text>

  <!-- Connectors from network bar down to each VM -->
  <line x1="205" y1="366" x2="205" y2="420" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="366" x2="490" y2="420" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="775" y1="366" x2="775" y2="420" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="60" y="590" width="14" height="14" fill="#0f172a"/>
  <text x="80" y="601" font-size="11" fill="#434863">Isolated host-only network (attack traffic stays here)</text>
  <line x1="420" y1="597" x2="445" y2="597" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="452" y="601" font-size="11" fill="#434863">NAT path — enabled only when updating a VM</text>
</svg>
